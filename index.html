
<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<title>Novixa AI</title>

<style>
body {
  font-family: Arial;
  text-align: center;
  background: #0f172a;
  color: white;
}

#chat {
  width: 300px;
  height: 400px;
  margin: auto;
  background: #1e293b;
  padding: 10px;
  border-radius: 10px;
  overflow-y: auto;
}

input {
  width: 220px;
  padding: 10px;
}

button {
  padding: 10px;
  background: #22c55e;
  border: none;
  color: white;
  cursor: pointer;
}
</style>

</head>

<body>

<h1>🚀 Novixa AI</h1>

<div id="chat"></div>

<br>

<input id="msg" placeholder="اكتب هنا..." />
<button onclick="send()">إرسال</button>

<script>
let history = [];

async function send() {
  const input = document.getElementById("msg");
  const message = input.value;

  if (!message) return;

  const chat = document.getElementById("chat");

  chat.innerHTML += `<div style="color:#38bdf8">أنت: ${message}</div>`;
  input.value = "";

  // Loading
  chat.innerHTML += `<div id="loading" style="color:yellow">AI: جاري التفكير...</div>`;

  const res = await fetch("/api/chat", {
    method: "POST",
    headers: {
      "Content-Type": "application/json"
    },
    body: JSON.stringify({
      message: message,
      history: history
    })
  });

  const data = await res.json();

  document.getElementById("loading").remove();

  chat.innerHTML += `<div style="color:#4ade80">AI: ${data.reply}</div>`;

  history.push({ role: "user", content: message });
  history.push({ role: "assistant", content: data.reply });

  chat.scrollTop = chat.scrollHeight;
}
</script>

</body>
</html>
