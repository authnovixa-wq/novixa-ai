
<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8" />
<title>Novixa AI</title>
<style>
body {
  background: linear-gradient(135deg,#0f172a,#1e293b);
  font-family: Arial;
  color: white;
  text-align: center;
}
.chat {
  width: 300px;
  height: 400px;
  margin: 40px auto;
  background: rgba(255,255,255,0.05);
  border-radius: 10px;
  padding: 10px;
  overflow-y: auto;
}
input {
  width: 220px;
  padding: 10px;
}
button {
  padding: 10px;
  background: #22c55e;
  border: none;
  color: white;
}
</style>
</head>

<body>

<h2>🚀 Novixa AI</h2>

<div id="chat" class="chat"></div>

<input id="input" placeholder="اكتب..." />
<button onclick="send()">إرسال</button>

<script>
async function send() {
  const input = document.getElementById("input");
  const chat = document.getElementById("chat");

  const msg = input.value;
  if (!msg) return;

  chat.innerHTML += `<div style="color:#38bdf8">أنت: ${msg}</div>`;

  input.value = "";

  try {
    const res = await fetch("/api/chat", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({ message: msg })
    });

    const data = await res.json();

    console.log("RESPONSE:", data);

    chat.innerHTML += `<div style="color:#22c55e">AI: ${data.reply}</div>`;

  } catch (e) {
    chat.innerHTML += `<div style="color:red">❌ خطأ في الاتصال</div>`;
  }
}
</script>

</body>
</html>
