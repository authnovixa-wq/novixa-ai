
<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8" />
<title>Novixa AI</title>
<style>
body {
  background: linear-gradient(135deg,#0f172a,#1e293b);
  font-family: Arial;
  color: white;
  text-align: center;
}
.chat {
  width: 300px;
  height: 400px;
  margin: 40px auto;
  background: rgba(255,255,255,0.05);
  border-radius: 10px;
  padding: 10px;
  overflow-y: auto;
}
input {
  width: 220px;
  padding: 10px;
<script>
let messages = [];

async function send() {
  const input = document.getElementById("input");
  const chat = document.getElementById("chat");

  const text = input.value;
  if (!text) return;

  // عرض رسالة المستخدم
  chat.innerHTML += `<div style="color:#38bdf8">أنت: ${text}</div>`;

  // حفظ الرسالة
  messages.push({
    role: "user",
    content: text
  });

  input.value = "";

  try {
    const res = await fetch("/api/chat", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        messages: messages
      })
    });

    const data = await res.json();

    // عرض رد الذكاء
    chat.innerHTML += `<div style="color:#22c55e">AI: ${data.reply}</div>`;

    // حفظ الرد
    messages.push({
      role: "assistant",
      content: data.reply
    });

  } catch (e) {
    chat.innerHTML += `<div style="color:red">❌ خطأ في الاتصال</div>`;
  }
}
</script>
button {
  padding: 10px;
  background: #22c55e;
  border: none;
  color: white;
}
</style>
</head>

<body>

<h2>🚀 Novixa AI</h2>

<div id="chat" class="chat"></div>

<input id="input" placeholder="اكتب..." />
<button onclick="send()">إرسال</button>



</body>
</html>
