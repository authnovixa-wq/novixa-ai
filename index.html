<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<title>Novixa AI</title>
</head>

<body style="background:#0b1c2c;color:white;text-align:center;padding:50px">

<h1>🚀 Novixa AI</h1>

<input id="msg" placeholder="اكتب رسالتك" style="width:60%;padding:10px" />
<button onclick="send()">إرسال</button>

<p id="res"></p>

<script>
async function send() {
  const msg = document.getElementById("msg").value;

  const res = await fetch("/api/chat", {
    method: "POST",
    headers: {
      "Content-Type": "application/json"
    },
    body: JSON.stringify({ message: msg })
  });

  const data = await res.json();

  if (data.reply) {
  document.getElementById("res").innerText = data.reply;
} else {
  document.getElementById("res").innerText = "❌ Error: " + JSON.stringify(data);
}
}
</script>

</body>
</html>
