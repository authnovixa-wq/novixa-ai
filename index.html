<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="UTF-8">
  <title>Novixa AI</title>
</head>

<body style="background:#0f172a;color:white;text-align:center;font-family:sans-serif">

  <h1>🚀 Novixa AI</h1>

  <div id="chat" style="height:300px;overflow:auto;border:1px solid #333;margin:20px;padding:10px"></div>

  <input id="input" placeholder="اكتب..." style="width:70%;padding:10px">
  <button onclick="send()" style="padding:10px">إرسال</button>

  <script>
    let messages = [];

    async function send() {
      const input = document.getElementById("input");
      const chat = document.getElementById("chat");

      const text = input.value;
      if (!text) return;

      chat.innerHTML += `<div style="color:#38bdf8">أنت: ${text}</div>`;

      messages.push({
        role: "user",
        content: text
      });

      input.value = "";

      try {
        const res = await fetch("/api/chat", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({ messages })
        });

        const data = await res.json();

        chat.innerHTML += `<div style="color:#22c55e">AI: ${data.reply}</div>`;

        messages.push({
          role: "assistant",
          content: data.reply
        });

      } catch {
        chat.innerHTML += `<div style="color:red">❌ خطأ في الاتصال</div>`;
      }
    }
  </script>

</body>
</html>
