<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<title>Novixa AI</title>

<style>
body {
  background: #0f172a;
  color: white;
  font-family: Arial;
  text-align: center;
}

#chat {
  width: 90%;
  max-width: 600px;
  height: 400px;
  margin: 20px auto;
  padding: 10px;
  overflow-y: auto;
  background: #1e293b;
  border-radius: 10px;
}

input {
  width: 70%;
  padding: 10px;
}

button {
  padding: 10px;
  background: #10b981;
  color: white;
  border: none;
  cursor: pointer;
}
</style>
</head>

<body>

<h2>🚀 Novixa AI</h2>

<div id="chat"></div>

<input id="input" placeholder="اكتب رسالتك...">
<button onclick="send()">إرسال</button>

<script>
let messages = [];

async function send() {
  const input = document.getElementById("input");
  const chat = document.getElementById("chat");

  const text = input.value.trim();
  if (!text) return;

  // عرض رسالة المستخدم
  chat.innerHTML += `<div style="color:#38bdf8">أنت: ${text}</div>`;

  messages.push({
    role: "user",
    content: text
  });

  input.value = "";

  try {
    const res = await fetch("/api/chat", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({ messages })
    });

    const data = await res.json();

    chat.innerHTML += `<div style="color:#22c55e">AI: ${data.reply}</div>`;

    messages.push({
      role: "assistant",
      content: data.reply
    });

  } catch (e) {
    chat.innerHTML += `<div style="color:red">❌ خطأ في الاتصال</div>`;
  }
}
</script>

</body>
</html>
